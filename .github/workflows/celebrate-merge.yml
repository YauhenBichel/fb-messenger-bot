name: Celebrate merge

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Pin the commit, not the tag: this job runs on pull_request_target
      # with pull-requests: write.
      - uses: YauhenBichel/merge-cheer@f9fa79020cf18b41d92e7ec4d9cc1636def6aaf4 # v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
