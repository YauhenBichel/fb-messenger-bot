name: Celebrate merge

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # Pin the commit, not the tag: this job runs on pull_request_target
      # with pull-requests: write.
      - uses: YauhenBichel/merge-cheer@90d7b7a0fcfd751ae4523c251888cafdf882b689 # min credits
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
